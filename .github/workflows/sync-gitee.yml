name: Sync Gitee Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-gitee:
    name: Sync Gitee release
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Release events check out the tag, so pin main; manual runs use the chosen ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}

      - name: Sync release assets to Gitee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: scripts/sync-gitee-release.sh "$TAG"

      - name: Report local fallback
        if: failure()
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          {
            echo "### Gitee sync failed for ${TAG}"
            echo "Assets already on Gitee are kept. The updater branch is only written after every asset is present."
            echo "Rerun the idempotent sync from a network that can reach Gitee:"
            echo '```bash'
            echo "GITHUB_TOKEN=<token> GITEE_TOKEN=<token> scripts/sync-gitee-release.sh ${TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
