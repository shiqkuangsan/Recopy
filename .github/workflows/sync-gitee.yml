name: Sync Gitee Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-gitee:
    name: Sync Gitee release
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Sync release assets to Gitee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: scripts/sync-gitee-release.sh "$TAG"
